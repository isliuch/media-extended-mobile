plugins {
    id "com.android.application"
}

android {
    namespace "com.mediaextended.mobile.capture"
    compileSdk 36

    defaultConfig {
        applicationId "com.mediaextended.mobile.capture"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }

    def releaseStore = System.getenv("ANDROID_KEYSTORE_PATH")
    def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def releaseAlias = System.getenv("ANDROID_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    if (releaseStore && releaseStorePassword && releaseAlias && releaseKeyPassword) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}
