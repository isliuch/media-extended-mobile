name: Release mobile plugin

on:
  push:
    tags:
      - "*-mobile.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "{./apps/app}..."
      - run: pnpm --filter ./apps/app type-check
      - run: pnpm test:mobile
      - run: pnpm --filter ./apps/app build
      - run: node scripts/prepare-release.mjs
      - run: pnpm audit:mobile
      - uses: actions/setup-java@v4
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Build signed Android capture helper
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/android-capture/signing/release.jks
        run: |
          mkdir -p apps/android-capture/signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod +x apps/android-capture/gradlew
          apps/android-capture/gradlew -p apps/android-capture :app:assembleRelease
          cp apps/android-capture/app/build/outputs/apk/release/app-release.apk media-extended-capture.apk
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const m=require('./manifest.json'); if (m.version !== process.env.RELEASE_TAG) throw Error('Tag and manifest version differ')"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(main.js manifest.json styles.css)
          if [[ -f media-extended-capture.apk ]]; then
            assets+=(media-extended-capture.apk)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --prerelease --generate-notes
