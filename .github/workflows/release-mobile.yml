name: Release mobile plugin

on:
  push:
    tags:
      - "*-mobile.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "{./apps/app}..."
      - run: pnpm --filter ./apps/app type-check
      - run: pnpm test:mobile
      - run: pnpm --filter ./apps/app build
      - run: node scripts/prepare-release.mjs
      - run: pnpm audit:mobile
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const m=require('./manifest.json'); if (m.version !== process.env.RELEASE_TAG) throw Error('Tag and manifest version differ')"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --prerelease --generate-notes
